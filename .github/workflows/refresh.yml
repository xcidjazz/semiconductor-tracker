name: Daily Refresh

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: "Semi Tracker/semiconductor_tracker"
        run: pip install -r requirements.txt

      - name: Fetch data
        working-directory: "Semi Tracker/semiconductor_tracker"
        run: python fetch_data.py

      - name: Build dashboard
        working-directory: "Semi Tracker/semiconductor_tracker"
        run: python build_dashboard.py

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Semi Tracker/semiconductor_tracker/data.json" "Semi Tracker/semiconductor_tracker/semiconductor_tracker.html"
          git commit -m "Refresh semiconductor tracker" || echo "No changes to commit"
          git push
